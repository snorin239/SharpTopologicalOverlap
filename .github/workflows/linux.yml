name: Linux build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      LAKE_CONFIG: ${{ github.workspace }}/lake-cache.toml

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify fresh checkout
        run: |
          test ! -e .lake
          test -z "$(git status --porcelain)"

      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-mathlib-cache: true
          use-github-cache: false

      - name: Fetch the TauCeti cache and build the formalization
        run: |
          lake cache get --package=TauCeti --service=tauceti-public --repo=TauCetiProject/TauCeti --mappings-only
          lake --wfail build

      - name: Verify theorem statements and report their axioms
        run: |
          for theorem in 11 12 71; do
            lake env lean -DwarningAsError=true "verification/Theorem${theorem}.lean"
          done

      - name: Verify repository remains clean
        run: |
          lean --version
          lake --version
          test -z "$(git status --porcelain)"
